<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema SaaS - Ordens de Serviço</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script>
  <style>
    body { background:#f3f4f6; }
    .hidden { display:none !important; }
    .glass { backdrop-filter: blur(14px); background: rgba(255,255,255,.9); }
    .card { border-radius: 18px; box-shadow: 0 10px 30px rgba(15,23,42,.08); }
    .btn { transition:.2s; }
    .btn:hover { transform: translateY(-1px); }
    input, select, textarea { outline:none; }
    @media print { .no-print { display:none!important; } body{background:#fff;} }
  </style>
</head>
<body class="min-h-screen text-slate-900">
  <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-blue-950 to-slate-900">
    <div class="glass card w-full max-w-md p-7">
      <div class="text-center mb-6">
        <div class="mx-auto w-16 h-16 rounded-2xl bg-blue-700 text-white flex items-center justify-center text-3xl font-black">OS</div>
        <h1 class="text-2xl font-black mt-4">Sistema SaaS de Serviços</h1>
        <p class="text-sm text-slate-600 mt-1">Login separado para Administrador e Técnico</p>
      </div>
      <label class="text-sm font-bold">Usuário</label>
      <input id="loginUser" class="w-full mt-1 mb-3 px-4 py-3 rounded-xl border" placeholder="admin ou técnico" />
      <label class="text-sm font-bold">Senha</label>
      <input id="loginPass" type="password" class="w-full mt-1 mb-4 px-4 py-3 rounded-xl border" placeholder="Digite a senha" />
      <button onclick="login()" class="btn w-full bg-blue-700 hover:bg-blue-800 text-white py-3 rounded-xl font-bold">Entrar</button>
      <div class="text-xs text-slate-600 mt-5 bg-slate-100 p-3 rounded-xl">
        <b>Acesso inicial:</b><br>Administrador: <b>admin</b> / <b>123</b><br>Técnico teste: <b>tecnico</b> / <b>123</b>
      </div>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="no-print sticky top-0 z-20 bg-slate-950 text-white shadow-lg">
      <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap gap-3 items-center justify-between">
        <div>
          <h2 class="font-black text-lg">Painel de Ordens de Serviço</h2>
          <p id="userBadge" class="text-xs text-blue-200"></p>
        </div>
        <div class="flex flex-wrap gap-2">
          <button onclick="syncNow()" class="btn bg-emerald-600 px-3 py-2 rounded-lg text-sm font-bold">Sincronizar</button>
          <button onclick="logout()" class="btn bg-red-600 px-3 py-2 rounded-lg text-sm font-bold">Sair</button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto p-4">
      <nav id="menu" class="no-print grid grid-cols-2 md:grid-cols-6 gap-2 mb-4"></nav>

      <section id="dashboard" class="module"></section>
      <section id="osModule" class="module hidden"></section>
      <section id="clientesModule" class="module hidden"></section>
      <section id="tecnicosModule" class="module hidden"></section>
      <section id="relatoriosModule" class="module hidden"></section>
      <section id="configModule" class="module hidden"></section>
    </main>
  </div>

<script>
'use strict';

const DEFAULT_DB = {
  users: [
    { id: uid(), nome:'Administrador', usuario:'admin', senha:'123', perfil:'admin', ativo:true },
    { id: uid(), nome:'Técnico Teste', usuario:'tecnico', senha:'123', perfil:'tecnico', ativo:true }
  ],
  clientes: [],
  tecnicos: [ { id: uid(), nome:'Técnico Teste', telefone:'', email:'', usuario:'tecnico', ativo:true } ],
  ordens: [],
  settings: {
    companyName: 'Minha Empresa',
    firebaseEnabled: false,
    firebaseConfig: ''
  }
};

let db = loadDB();
let currentUser = null;
let firebaseDB = null;
let syncingRemote = false;

function uid(){ return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,9); }
function today(){ return new Date().toISOString().slice(0,10); }
function nowTime(){ return new Date().toTimeString().slice(0,5); }
function money(v){ return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function safe(v){ return String(v ?? '').replace(/[&<>"]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s])); }
function saveDB(){ localStorage.setItem('saas_os_db_v1', JSON.stringify(db)); pushRemote(); }
function loadDB(){ try { return JSON.parse(localStorage.getItem('saas_os_db_v1')) || structuredClone(DEFAULT_DB); } catch { return structuredClone(DEFAULT_DB); } }

function login(){
  const usuario = document.getElementById('loginUser').value.trim();
  const senha = document.getElementById('loginPass').value.trim();
  const user = db.users.find(u => u.usuario === usuario && u.senha === senha && u.ativo);
  if(!user) return alert('Usuário ou senha inválidos.');
  currentUser = user;
  sessionStorage.setItem('current_user', JSON.stringify(user));
  startApp();
}
function logout(){ sessionStorage.removeItem('current_user'); location.reload(); }
function startApp(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('userBadge').innerText = `${currentUser.nome} • Perfil: ${currentUser.perfil === 'admin' ? 'Administrador/RH' : 'Técnico de rua'}`;
  initFirebase();
  renderMenu();
  renderAll();
  showModule('dashboard');
}

function renderMenu(){
  const items = [
    ['dashboard','Dashboard'], ['osModule','Ordens'], ['clientesModule','Clientes'],
    ['relatoriosModule','Relatórios'], ['configModule','Configurações']
  ];
  if(currentUser.perfil === 'admin') items.splice(3,0,['tecnicosModule','Técnicos']);
  document.getElementById('menu').innerHTML = items.map(i => `<button onclick="showModule('${i[0]}')" class="btn menuBtn bg-white card px-3 py-3 font-bold text-sm">${i[1]}</button>`).join('');
}
function showModule(id){
  document.querySelectorAll('.module').forEach(m => m.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}
function renderAll(){ renderDashboard(); renderOS(); renderClientes(); renderTecnicos(); renderRelatorios(); renderConfig(); }

function renderDashboard(){
  const ordensVisiveis = visibleOrders();
  const total = ordensVisiveis.length;
  const concluidas = ordensVisiveis.filter(o=>o.status==='Concluído').length;
  const andamento = ordensVisiveis.filter(o=>o.status==='Em andamento').length;
  const pendente = ordensVisiveis.filter(o=>o.status==='Pendente').length;
  document.getElementById('dashboard').innerHTML = `
    <div class="grid md:grid-cols-4 gap-3 mb-4">
      ${stat('Total de OS', total, 'bg-blue-700')}
      ${stat('Concluídas', concluidas, 'bg-emerald-600')}
      ${stat('Em andamento', andamento, 'bg-amber-500')}
      ${stat('Pendentes', pendente, 'bg-red-600')}
    </div>
    <div class="card bg-white p-4">
      <h3 class="text-xl font-black mb-3">Últimas ordens de serviço</h3>
      ${ordersTable(ordensVisiveis.slice(-8).reverse())}
    </div>`;
}
function stat(t,v,c){ return `<div class="card ${c} text-white p-5"><p class="text-sm opacity-90">${t}</p><b class="text-3xl">${v}</b></div>`; }

function visibleOrders(){
  if(currentUser.perfil === 'admin') return db.ordens;
  return db.ordens.filter(o => o.tecnicoUsuario === currentUser.usuario || o.tecnicoId === currentUser.id);
}

function renderOS(){
  const clientesOptions = db.clientes.map(c=>`<option value="${c.id}">${safe(c.nome)} - ${safe(c.telefone)}</option>`).join('');
  const tecnicosOptions = db.tecnicos.map(t=>`<option value="${t.id}">${safe(t.nome)}</option>`).join('');
  const canChooseTech = currentUser.perfil === 'admin';
  document.getElementById('osModule').innerHTML = `
    <div class="grid lg:grid-cols-3 gap-4">
      <form onsubmit="saveOS(event)" class="card bg-white p-4 lg:col-span-1">
        <h3 class="text-xl font-black mb-4">Nova Ordem de Serviço</h3>
        <label class="text-sm font-bold">Cliente cadastrado</label>
        <select id="osCliente" required class="w-full border rounded-xl px-3 py-3 mb-3"><option value="">Selecione</option>${clientesOptions}</select>
        <label class="text-sm font-bold">Técnico responsável</label>
        <select id="osTecnico" ${canChooseTech?'':'disabled'} required class="w-full border rounded-xl px-3 py-3 mb-3"><option value="">Selecione</option>${tecnicosOptions}</select>
        <label class="text-sm font-bold">Local do atendimento</label>
        <input id="osLocal" required class="w-full border rounded-xl px-3 py-3 mb-3" placeholder="Endereço ou referência" />
        <div class="grid grid-cols-2 gap-2">
          <div><label class="text-sm font-bold">Data</label><input id="osData" type="date" value="${today()}" required class="w-full border rounded-xl px-3 py-3 mb-3" /></div>
          <div><label class="text-sm font-bold">Hora</label><input id="osHora" type="time" value="${nowTime()}" required class="w-full border rounded-xl px-3 py-3 mb-3" /></div>
        </div>
        <label class="text-sm font-bold">Situação</label>
        <select id="osStatus" class="w-full border rounded-xl px-3 py-3 mb-3"><option>Pendente</option><option>Em andamento</option><option>Concluído</option></select>
        <label class="text-sm font-bold">Problema relatado</label>
        <textarea id="osProblema" required class="w-full border rounded-xl px-3 py-3 mb-3" rows="3" placeholder="Descreva o problema"></textarea>
        <label class="text-sm font-bold">Material da empresa utilizado</label>
        <textarea id="osMaterial" class="w-full border rounded-xl px-3 py-3 mb-3" rows="3" placeholder="Ex: cabo, fonte, conector. Se não usou, escreva: Não utilizado"></textarea>
        <button type="button" onclick="getLocationOS()" class="btn w-full bg-slate-800 text-white py-3 rounded-xl font-bold mb-3">Capturar localização opcional</button>
        <input id="osLatLng" readonly class="w-full border rounded-xl px-3 py-3 mb-3 bg-slate-100" placeholder="Latitude, Longitude" />
        <label class="text-sm font-bold">Foto antes opcional</label><input id="fotoAntes" type="file" accept="image/*" capture="environment" class="w-full mb-3" />
        <label class="text-sm font-bold">Foto durante opcional</label><input id="fotoDurante" type="file" accept="image/*" capture="environment" class="w-full mb-3" />
        <label class="text-sm font-bold">Foto final opcional</label><input id="fotoFinal" type="file" accept="image/*" capture="environment" class="w-full mb-4" />
        <button class="btn w-full bg-blue-700 text-white py-3 rounded-xl font-black">Salvar OS</button>
      </form>
      <div class="card bg-white p-4 lg:col-span-2 overflow-auto">
        <div class="flex flex-wrap justify-between gap-2 mb-3">
          <h3 class="text-xl font-black">Ordens cadastradas</h3>
          <input oninput="filterOrders(this.value)" class="border rounded-xl px-3 py-2" placeholder="Buscar OS..." />
        </div>
        <div id="ordersList">${ordersTable(visibleOrders().slice().reverse())}</div>
      </div>
    </div>`;
  if(!canChooseTech){
    const tech = db.tecnicos.find(t=>t.usuario === currentUser.usuario) || db.tecnicos[0];
    setTimeout(()=>{ if(tech) document.getElementById('osTecnico').value = tech.id; },0);
  }
}

async function fileToBase64(input){
  const f = input.files && input.files[0];
  if(!f) return '';
  if(f.size > 2_000_000) alert('Imagem grande detectada. O sistema irá salvar, mas pode pesar no navegador. Recomendado até 2MB.');
  return new Promise((resolve,reject)=>{ const r = new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(f); });
}
async function saveOS(e){
  e.preventDefault();
  const cliente = db.clientes.find(c=>c.id===val('osCliente'));
  const tecnico = db.tecnicos.find(t=>t.id===val('osTecnico'));
  if(!cliente || !tecnico) return alert('Selecione cliente e técnico.');
  const os = {
    id: uid(), numero: db.ordens.length + 1, clienteId: cliente.id, clienteNome: cliente.nome,
    tecnicoId: tecnico.id, tecnicoNome: tecnico.nome, tecnicoUsuario: tecnico.usuario,
    local: val('osLocal'), data: val('osData'), hora: val('osHora'), status: val('osStatus'),
    problema: val('osProblema'), material: val('osMaterial') || 'Não utilizado', latlng: val('osLatLng'),
    fotos: { antes: await fileToBase64(document.getElementById('fotoAntes')), durante: await fileToBase64(document.getElementById('fotoDurante')), final: await fileToBase64(document.getElementById('fotoFinal')) },
    criadoPor: currentUser.nome, criadoEm: new Date().toISOString()
  };
  db.ordens.push(os); saveDB(); renderAll(); showModule('osModule'); alert('OS salva com sucesso.');
}
function val(id){ return document.getElementById(id).value.trim(); }
function getLocationOS(){
  if(!navigator.geolocation) return alert('Geolocalização não suportada neste aparelho.');
  navigator.geolocation.getCurrentPosition(pos=>{
    document.getElementById('osLatLng').value = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
  }, err=> alert('Não foi possível capturar localização: ' + err.message), { enableHighAccuracy:true, timeout:10000 });
}
function filterOrders(q){
  q = q.toLowerCase();
  const list = visibleOrders().filter(o => JSON.stringify(o).toLowerCase().includes(q)).reverse();
  document.getElementById('ordersList').innerHTML = ordersTable(list);
}
function ordersTable(list){
  if(!list.length) return `<p class="text-slate-500 p-4">Nenhuma ordem encontrada.</p>`;
  return `<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="bg-slate-100"><th class="p-2 text-left">OS</th><th class="p-2 text-left">Cliente</th><th class="p-2 text-left">Técnico</th><th class="p-2 text-left">Data</th><th class="p-2 text-left">Status</th><th class="p-2 text-left no-print">Ações</th></tr></thead><tbody>${list.map(o=>`<tr class="border-b"><td class="p-2 font-bold">#${o.numero}</td><td class="p-2">${safe(o.clienteNome)}</td><td class="p-2">${safe(o.tecnicoNome)}</td><td class="p-2">${safe(o.data)} ${safe(o.hora)}</td><td class="p-2"><span class="px-2 py-1 rounded-lg text-xs font-bold ${o.status==='Concluído'?'bg-emerald-100 text-emerald-700':o.status==='Em andamento'?'bg-amber-100 text-amber-700':'bg-red-100 text-red-700'}">${safe(o.status)}</span></td><td class="p-2 no-print"><button onclick="viewOS('${o.id}')" class="bg-blue-700 text-white px-2 py-1 rounded">Ver/PDF</button> <button onclick="deleteOS('${o.id}')" class="${currentUser.perfil==='admin'?'':'hidden'} bg-red-600 text-white px-2 py-1 rounded">Excluir</button></td></tr>`).join('')}</tbody></table></div>`;
}
function viewOS(id){
  const o = db.ordens.find(x=>x.id===id); if(!o) return;
  const w = window.open('', '_blank');
  w.document.write(`<html><head><title>OS #${o.numero}</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"><\/script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"><\/script><style>body{font-family:Arial;padding:24px;color:#111} .box{border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0} img{max-width:31%;margin:1%;border-radius:8px;border:1px solid #ddd} button{background:#1d4ed8;color:white;border:0;padding:12px 18px;border-radius:10px;font-weight:bold}</style></head><body><button onclick="baixar()">Baixar PDF</button><div id="pdf"><h1>Ordem de Serviço #${o.numero}</h1><p><b>Empresa:</b> ${safe(db.settings.companyName)}</p><div class="box"><p><b>Cliente:</b> ${safe(o.clienteNome)}</p><p><b>Técnico:</b> ${safe(o.tecnicoNome)}</p><p><b>Local:</b> ${safe(o.local)}</p><p><b>Data/Hora:</b> ${safe(o.data)} ${safe(o.hora)}</p><p><b>Status:</b> ${safe(o.status)}</p><p><b>Localização:</b> ${safe(o.latlng || 'Não informada')}</p></div><div class="box"><h3>Problema</h3><p>${safe(o.problema)}</p><h3>Material utilizado</h3><p>${safe(o.material)}</p></div><div class="box"><h3>Fotos</h3>${o.fotos?.antes?`<img src="${o.fotos.antes}"><p>Antes</p>`:''}${o.fotos?.durante?`<img src="${o.fotos.durante}"><p>Durante</p>`:''}${o.fotos?.final?`<img src="${o.fotos.final}"><p>Final</p>`:''}${(!o.fotos?.antes&&!o.fotos?.durante&&!o.fotos?.final)?'<p>Nenhuma foto anexada.</p>':''}</div><p>Gerado em ${new Date().toLocaleString('pt-BR')}</p></div><script>async function baixar(){const {jsPDF}=window.jspdf;const el=document.getElementById('pdf');const canvas=await html2canvas(el,{scale:2});const img=canvas.toDataURL('image/png');const pdf=new jsPDF('p','mm','a4');const w=210,h=canvas.height*w/canvas.width;pdf.addImage(img,'PNG',0,0,w,h);pdf.save('OS_${o.numero}.pdf')}<\/script></body></html>`);
  w.document.close();
}
function deleteOS(id){ if(confirm('Excluir esta OS?')){ db.ordens = db.ordens.filter(o=>o.id!==id); saveDB(); renderAll(); } }

function renderClientes(){
  document.getElementById('clientesModule').innerHTML = `<div class="grid lg:grid-cols-3 gap-4"><form onsubmit="saveCliente(event)" class="card bg-white p-4"><h3 class="text-xl font-black mb-4">Cadastrar Cliente</h3><input id="cliNome" required class="w-full border rounded-xl px-3 py-3 mb-3" placeholder="Nome/Razão social"><input id="cliTel" class="w-full border rounded-xl px-3 py-3 mb-3" placeholder="Telefone"><input id="cliEmail" class="w-full border rounded-xl px-3 py-3 mb-3" placeholder="E-mail"><input id="cliEnd" class="w-full border rounded-xl px-3 py-3 mb-3" placeholder="Endereço"><button class="btn w-full bg-blue-700 text-white py-3 rounded-xl font-black">Salvar Cliente</button></form><div class="card bg-white p-4 lg:col-span-2"><h3 class="text-xl font-black mb-3">Clientes</h3>${simpleTable(db.clientes,['nome','telefone','email','endereco'],'cliente')}</div></div>`;
}
function saveCliente(e){ e.preventDefault(); db.clientes.push({id:uid(), nome:val('cliNome'), telefone:val('cliTel'), email:val('cliEmail'), endereco:val('cliEnd')}); saveDB(); renderAll(); showModule('clientesModule'); }

function renderTecnicos(){
  if(currentUser.perfil !== 'admin') return;
  document.getElementById('tecnicosModule').innerHTML = `<div class="grid lg:grid-cols-3 gap-4"><form onsubmit="saveTecnico(event)" class="card bg-white p-4"><h3 class="text-xl font-black mb-4">Cadastrar Técnico</h3><input id="tecNome" required class="w-full border rounded-xl px-3 py-3 mb-3" placeholder="Nome"><input id="tecTel" class="w-full border rounded-xl px-3 py-3 mb-3" placeholder="Telefone"><input id="tecEmail" class="w-full border rounded-xl px-3 py-3 mb-3" placeholder="E-mail"><input id="tecUser" required class="w-full border rounded-xl px-3 py-3 mb-3" placeholder="Usuário de login"><input id="tecPass" required class="w-full border rounded-xl px-3 py-3 mb-3" placeholder="Senha"><button class="btn w-full bg-blue-700 text-white py-3 rounded-xl font-black">Salvar Técnico</button></form><div class="card bg-white p-4 lg:col-span-2"><h3 class="text-xl font-black mb-3">Técnicos</h3>${simpleTable(db.tecnicos,['nome','telefone','email','usuario'],'tecnico')}</div></div>`;
}
function saveTecnico(e){
  e.preventDefault();
  if(db.users.some(u=>u.usuario===val('tecUser'))) return alert('Este usuário já existe.');
  const id = uid();
  db.tecnicos.push({id, nome:val('tecNome'), telefone:val('tecTel'), email:val('tecEmail'), usuario:val('tecUser'), ativo:true});
  db.users.push({id, nome:val('tecNome'), usuario:val('tecUser'), senha:val('tecPass'), perfil:'tecnico', ativo:true});
  saveDB(); renderAll(); showModule('tecnicosModule');
}
function simpleTable(arr, fields, type){
  if(!arr.length) return '<p class="text-slate-500">Nenhum cadastro.</p>';
  return `<div class="overflow-x-auto"><table class="w-full text-sm"><tbody>${arr.map(x=>`<tr class="border-b">${fields.map(f=>`<td class="p-2">${safe(x[f])}</td>`).join('')}<td class="p-2 text-right"><button onclick="removeItem('${type}','${x.id}')" class="${currentUser.perfil==='admin'?'':'hidden'} bg-red-600 text-white px-2 py-1 rounded">Excluir</button></td></tr>`).join('')}</tbody></table></div>`;
}
function removeItem(type,id){
  if(!confirm('Excluir cadastro?')) return;
  if(type==='cliente') db.clientes = db.clientes.filter(x=>x.id!==id);
  if(type==='tecnico'){ db.tecnicos = db.tecnicos.filter(x=>x.id!==id); db.users = db.users.filter(x=>x.id!==id); }
  saveDB(); renderAll();
}

function renderRelatorios(){
  document.getElementById('relatoriosModule').innerHTML = `<div class="card bg-white p-4"><h3 class="text-xl font-black mb-4">Relatório diário e por período</h3><div class="grid md:grid-cols-4 gap-2 mb-4"><input id="relIni" type="date" value="${today()}" class="border rounded-xl px-3 py-3"><input id="relFim" type="date" value="${today()}" class="border rounded-xl px-3 py-3"><select id="relStatus" class="border rounded-xl px-3 py-3"><option value="">Todos status</option><option>Pendente</option><option>Em andamento</option><option>Concluído</option></select><button onclick="gerarRelatorio()" class="btn bg-blue-700 text-white rounded-xl font-black">Gerar</button></div><div id="relatorioArea"></div></div>`;
}
function gerarRelatorio(){
  const ini = val('relIni'), fim = val('relFim'), st = val('relStatus');
  let list = visibleOrders().filter(o=>o.data >= ini && o.data <= fim && (!st || o.status===st));
  document.getElementById('relatorioArea').innerHTML = `<div id="relPDF" class="p-4 border rounded-xl"><h2 class="text-2xl font-black">Relatório de OS</h2><p>Período: ${safe(ini)} até ${safe(fim)}</p><p>Total: <b>${list.length}</b></p>${ordersTable(list)}</div><button onclick="baixarRelatorioPDF()" class="btn mt-3 bg-emerald-600 text-white px-4 py-3 rounded-xl font-black">Baixar relatório em PDF</button>`;
}
async function baixarRelatorioPDF(){
  const { jsPDF } = window.jspdf;
  const el = document.getElementById('relPDF');
  const canvas = await html2canvas(el,{scale:2});
  const img = canvas.toDataURL('image/png');
  const pdf = new jsPDF('p','mm','a4');
  const w = 210, h = canvas.height*w/canvas.width;
  pdf.addImage(img,'PNG',0,0,w,h);
  pdf.save('relatorio_os.pdf');
}

function renderConfig(){
  document.getElementById('configModule').innerHTML = `<div class="card bg-white p-4"><h3 class="text-xl font-black mb-4">Configurações SaaS</h3><label class="text-sm font-bold">Nome da empresa</label><input id="cfgCompany" value="${safe(db.settings.companyName)}" class="w-full border rounded-xl px-3 py-3 mb-4"><label class="flex items-center gap-2 mb-2"><input id="cfgFirebaseEnabled" type="checkbox" ${db.settings.firebaseEnabled?'checked':''}> Ativar Firebase Realtime Database</label><textarea id="cfgFirebase" class="w-full border rounded-xl px-3 py-3 mb-3" rows="8" placeholder='Cole aqui seu firebaseConfig em JSON, exemplo: {"apiKey":"...","authDomain":"...","databaseURL":"...","projectId":"...","storageBucket":"...","messagingSenderId":"...","appId":"..."}'>${safe(db.settings.firebaseConfig)}</textarea><button onclick="saveConfig()" class="btn bg-blue-700 text-white px-4 py-3 rounded-xl font-black">Salvar Configurações</button><div class="mt-4 text-sm bg-amber-50 border border-amber-200 p-3 rounded-xl"><b>Importante:</b> GitHub Pages é hospedagem estática. Para dados em tempo real entre rua e escritório, use Firebase Realtime Database. Google Drive/Sheets exige Apps Script ou backend para funcionar com segurança.</div></div>`;
}
function saveConfig(){
  db.settings.companyName = val('cfgCompany') || 'Minha Empresa';
  db.settings.firebaseEnabled = document.getElementById('cfgFirebaseEnabled').checked;
  db.settings.firebaseConfig = val('cfgFirebase');
  saveDB(); initFirebase(true); renderAll(); showModule('configModule'); alert('Configurações salvas.');
}

function initFirebase(force=false){
  if(!db.settings.firebaseEnabled || !db.settings.firebaseConfig) return;
  try{
    if(!firebase.apps.length || force){
      const config = JSON.parse(db.settings.firebaseConfig);
      if(!firebase.apps.length) firebase.initializeApp(config);
      firebaseDB = firebase.database();
      firebaseDB.ref('saas_os_db_v1').on('value', snap => {
        if(syncingRemote) return;
        const remote = snap.val();
        if(remote && remote.ordens){ db = remote; localStorage.setItem('saas_os_db_v1', JSON.stringify(db)); renderAll(); }
      });
    }
  } catch(e){ console.warn(e); alert('Firebase não conectado. Confira o JSON da configuração.'); }
}
function pushRemote(){
  if(!firebaseDB || !db.settings.firebaseEnabled) return;
  syncingRemote = true;
  firebaseDB.ref('saas_os_db_v1').set(db).finally(()=> syncingRemote=false);
}
function syncNow(){ saveDB(); alert(firebaseDB ? 'Sincronização enviada.' : 'Dados salvos localmente. Configure Firebase para tempo real.'); }

window.addEventListener('load', () => {
  const s = sessionStorage.getItem('current_user');
  if(s){ currentUser = JSON.parse(s); startApp(); }
});
</script>
