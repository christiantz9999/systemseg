<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>FieldPro OS SaaS - Firebase</title>
  <link rel="manifest" id="manifestLink">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-storage-compat.js"></script>
  <style>
    :root{--brand:#0f172a;--blue:#2563eb;--green:#16a34a;--red:#dc2626;--amber:#d97706}
    *{box-sizing:border-box} body{background:#f1f5f9;color:#0f172a} .hidden{display:none!important}
    .card{border-radius:20px;box-shadow:0 18px 45px rgba(15,23,42,.08);background:#fff}.btn{transition:.2s}.btn:hover{transform:translateY(-1px);filter:brightness(.98)}
    input,select,textarea{outline:none}.tab-active{background:#2563eb!important;color:#fff!important}.sig{touch-action:none;background:#fff;border:1px solid #cbd5e1;border-radius:14px;width:100%;height:180px}
    @media print{.no-print{display:none!important} body{background:#fff}.card{box-shadow:none}}
  </style>
</head>
<body>
<div id="loginScreen" class="min-h-screen bg-gradient-to-br from-slate-950 via-blue-950 to-slate-900 flex items-center justify-center p-4">
  <div class="card w-full max-w-md p-7">
    <div class="text-center mb-5">
      <div class="mx-auto w-16 h-16 rounded-2xl bg-blue-700 text-white flex items-center justify-center text-3xl font-black">OS</div>
      <h1 class="text-2xl font-black mt-4">FieldPro OS SaaS</h1>
      <p class="text-sm text-slate-500">Firebase Auth + Realtime Database + Storage</p>
    </div>
    <div id="firebaseAlert" class="hidden bg-red-50 border border-red-200 text-red-700 p-3 rounded-xl text-sm mb-3"></div>
    <label class="text-sm font-bold">E-mail</label>
    <input id="email" type="email" class="w-full border rounded-xl px-4 py-3 mb-3" placeholder="admin@empresa.com" />
    <label class="text-sm font-bold">Senha</label>
    <input id="senha" type="password" class="w-full border rounded-xl px-4 py-3 mb-4" placeholder="Sua senha" />
    <button onclick="login()" class="btn w-full bg-blue-700 text-white rounded-xl py-3 font-black">Entrar</button>
    <button onclick="resetPassword()" class="btn w-full mt-2 bg-slate-100 rounded-xl py-3 font-bold">Recuperar senha</button>
    <p class="text-xs text-slate-500 mt-4">Primeiro acesso: crie o usuário no Firebase Authentication e cadastre o perfil em /users no Realtime Database.</p>
  </div>
</div>

<div id="app" class="hidden">
  <header class="no-print sticky top-0 z-30 bg-slate-950 text-white shadow-xl">
    <div class="max-w-7xl mx-auto p-3 flex flex-wrap justify-between gap-3 items-center">
      <div><h2 class="font-black text-lg" id="companyTitle">FieldPro OS</h2><p id="userInfo" class="text-xs text-blue-200"></p></div>
      <div class="flex gap-2 flex-wrap"><span id="onlineStatus" class="px-3 py-2 rounded-lg bg-slate-800 text-xs font-bold">ONLINE</span><button onclick="installPWA()" class="btn bg-emerald-600 px-3 py-2 rounded-lg font-bold text-sm">Instalar App</button><button onclick="logout()" class="btn bg-red-600 px-3 py-2 rounded-lg font-bold text-sm">Sair</button></div>
    </div>
  </header>
  <main class="max-w-7xl mx-auto p-4">
    <nav id="menu" class="no-print grid grid-cols-2 md:grid-cols-5 lg:grid-cols-9 gap-2 mb-4"></nav>
    <section id="dashboard" class="module"></section>
    <section id="os" class="module hidden"></section>
    <section id="clientes" class="module hidden"></section>
    <section id="tecnicos" class="module hidden"></section>
    <section id="estoque" class="module hidden"></section>
    <section id="financeiro" class="module hidden"></section>
    <section id="rh" class="module hidden"></section>
    <section id="relatorios" class="module hidden"></section>
    <section id="config" class="module hidden"></section>
  </main>
</div>

<script>
'use strict';

/* COLE AQUI O SEU FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyAt2TnAniXroOM3azPGV_V_E7aRppHe8ck",
  authDomain: "systemseg.firebaseapp.com",
  databaseURL: "https://systemseg-default-rtdb.firebaseio.com",
  projectId: "systemseg",
  storageBucket: "systemseg.firebasestorage.app",
  messagingSenderId: "944347398449",
  appId: "1:944347398449:web:cca015078ceadf8e89b010",
  measurementId: "G-1KEH3RN3HV"
};

let app, auth, rtdb, storage, currentUser=null, profile=null, state={users:{},clientes:{},tecnicos:{},ordens:{},estoque:{},financeiro:{},company:{nome:'FieldPro OS',logo:''}};
let charts=[], deferredPrompt=null, signaturePad={drawing:false, canvas:null, ctx:null};

function init(){
  setupPWA();
  try{
    if(firebaseConfig.apiKey==='COLE_AQUI') throw new Error('Firebase ainda não configurado no código.');
    app=firebase.initializeApp(firebaseConfig); auth=firebase.auth(); rtdb=firebase.database(); storage=firebase.storage();
    firebase.database().goOnline();
    auth.onAuthStateChanged(async user=>{ if(user){ currentUser=user; await loadProfile(); startRealtime(); } else showLogin(); });
  }catch(e){ showFirebaseError(e.message); }
  window.addEventListener('online',()=>setOnline(true)); window.addEventListener('offline',()=>setOnline(false)); setOnline(navigator.onLine);
}
function showFirebaseError(msg){ const el=document.getElementById('firebaseAlert'); el.classList.remove('hidden'); el.innerText=msg; }
function showLogin(){ document.getElementById('loginScreen').classList.remove('hidden'); document.getElementById('app').classList.add('hidden'); }
async function login(){ try{ await auth.signInWithEmailAndPassword(val('email'),val('senha')); }catch(e){ alert('Erro no login: '+e.message); } }
async function resetPassword(){ const e=val('email'); if(!e) return alert('Digite o e-mail.'); await auth.sendPasswordResetEmail(e); alert('E-mail de recuperação enviado.'); }
function logout(){ auth.signOut(); }
async function loadProfile(){
  const snap=await rtdb.ref('users/'+currentUser.uid).once('value'); profile=snap.val();
  if(!profile){ alert('Usuário autenticado, mas sem perfil em /users/'+currentUser.uid+'. Cadastre como admin ou tecnico no Realtime Database.'); await logout(); return; }
  document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('app').classList.remove('hidden');
  document.getElementById('userInfo').innerText=`${profile.nome||currentUser.email} • ${profile.role==='admin'?'Administrador/RH':'Técnico'}`;
  renderMenu();
}
function startRealtime(){
  rtdb.ref().on('value',snap=>{ const data=snap.val()||{}; state={users:data.users||{},clientes:data.clientes||{},tecnicos:data.tecnicos||{},ordens:data.ordens||{},estoque:data.estoque||{},financeiro:data.financeiro||{},company:data.company||{nome:'FieldPro OS',logo:''}}; renderAll(); });
}
function setOnline(on){ const el=document.getElementById('onlineStatus'); if(!el)return; el.innerText=on?'ONLINE':'OFFLINE'; el.className='px-3 py-2 rounded-lg text-xs font-bold '+(on?'bg-emerald-700':'bg-amber-600'); }
function val(id){ return (document.getElementById(id)?.value||'').trim(); } function uid(){ return rtdb.ref().push().key; } function safe(v){ return String(v??'').replace(/[&<>"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s])); } function today(){ return new Date().toISOString().slice(0,10); } function now(){ return new Date().toTimeString().slice(0,5); } function brl(v){ return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); } function arr(o){ return Object.entries(o||{}).map(([id,v])=>({id,...v})); }
function isAdmin(){return profile?.role==='admin'} function visibleOrders(){ const a=arr(state.ordens); return isAdmin()?a:a.filter(o=>o.tecnicoUid===currentUser.uid); }

function renderMenu(){ const base=[['dashboard','Dashboard'],['os','OS'],['clientes','Clientes'],['estoque','Estoque'],['financeiro','Financeiro'],['relatorios','Relatórios']]; if(isAdmin()){base.splice(3,0,['tecnicos','Técnicos']); base.splice(7,0,['rh','Painel RH']); base.push(['config','Config']);} document.getElementById('menu').innerHTML=base.map(x=>`<button id="tab_${x[0]}" onclick="show('${x[0]}')" class="tab btn card py-3 px-2 font-black text-sm">${x[1]}</button>`).join(''); }
function show(id){ document.querySelectorAll('.module').forEach(x=>x.classList.add('hidden')); document.querySelectorAll('.tab').forEach(x=>x.classList.remove('tab-active')); document.getElementById(id).classList.remove('hidden'); document.getElementById('tab_'+id)?.classList.add('tab-active'); }
function renderAll(){ document.getElementById('companyTitle').innerText=state.company.nome||'FieldPro OS'; renderDashboard(); renderOS(); renderClientes(); renderTecnicos(); renderEstoque(); renderFinanceiro(); renderRH(); renderRelatorios(); renderConfig(); if(!document.querySelector('.tab-active')) show('dashboard'); }

function renderDashboard(){ const os=visibleOrders(), total=os.length, conc=os.filter(o=>o.status==='Concluído').length, pend=os.filter(o=>o.status==='Pendente').length, and=os.filter(o=>o.status==='Em andamento').length; document.getElementById('dashboard').innerHTML=`<div class="grid md:grid-cols-4 gap-3 mb-4">${stat('Total OS',total,'bg-blue-700')}${stat('Concluídas',conc,'bg-emerald-600')}${stat('Em andamento',and,'bg-amber-600')}${stat('Pendentes',pend,'bg-red-600')}</div><div class="grid lg:grid-cols-2 gap-4"><div class="card p-4"><h3 class="font-black text-xl mb-3">Gráfico por situação</h3><canvas id="chartStatus"></canvas></div><div class="card p-4"><h3 class="font-black text-xl mb-3">Últimas OS</h3>${ordersTable(os.slice(-8).reverse())}</div></div>`; setTimeout(()=>drawChart('chartStatus',['Concluídas','Em andamento','Pendentes'],[conc,and,pend]),50); }
function stat(t,v,c){return`<div class="card ${c} text-white p-5"><p class="text-sm opacity-90">${t}</p><b class="text-3xl">${v}</b></div>`}
function drawChart(id,labels,data){ const c=document.getElementById(id); if(!c)return; charts.forEach(x=>x.destroy()); charts=[]; charts.push(new Chart(c,{type:'doughnut',data:{labels,datasets:[{data}]},options:{plugins:{legend:{position:'bottom'}}}})); }

function renderOS(){ const clientes=arr(state.clientes), tecs=arr(state.tecnicos); document.getElementById('os').innerHTML=`<div class="grid xl:grid-cols-3 gap-4"><form onsubmit="saveOS(event)" class="card p-4"><h3 class="font-black text-xl mb-4">Nova Ordem de Serviço</h3>${select('osCliente','Cliente',clientes,'nome',true)}${isAdmin()?select('osTec','Técnico',tecs,'nome',true):''}<input id="osLocal" required class="w-full border rounded-xl px-3 py-3 mb-3" placeholder="Local/endereço"><div class="grid grid-cols-2 gap-2"><input id="osData" type="date" value="${today()}" required class="border rounded-xl px-3 py-3 mb-3"><input id="osHora" type="time" value="${now()}" required class="border rounded-xl px-3 py-3 mb-3"></div><select id="osStatus" class="w-full border rounded-xl px-3 py-3 mb-3"><option>Pendente</option><option>Em andamento</option><option>Concluído</option></select><textarea id="osProblema" required class="w-full border rounded-xl px-3 py-3 mb-3" rows="3" placeholder="Descreva o problema"></textarea><textarea id="osMaterial" class="w-full border rounded-xl px-3 py-3 mb-3" rows="2" placeholder="Material usado ou Não utilizado"></textarea><button type="button" onclick="captureLocation()" class="btn w-full bg-slate-800 text-white py-3 rounded-xl font-bold mb-3">Capturar localização</button><input id="osLatLng" readonly class="w-full border bg-slate-100 rounded-xl px-3 py-3 mb-3" placeholder="Latitude, Longitude"><label class="text-sm font-bold">Fotos antes/durante/final</label><input id="fotos" type="file" accept="image/*" capture="environment" multiple class="w-full mb-3"><label class="text-sm font-bold">Assinatura do cliente</label><canvas id="signature" class="sig mb-2"></canvas><button type="button" onclick="clearSignature()" class="btn bg-slate-100 px-3 py-2 rounded-lg mb-3">Limpar assinatura</button><button class="btn w-full bg-blue-700 text-white py-3 rounded-xl font-black">Salvar OS</button></form><div class="card p-4 xl:col-span-2 overflow-auto"><h3 class="font-black text-xl mb-3">Ordens em tempo real</h3>${ordersTable(visibleOrders().slice().reverse())}</div></div>`; setTimeout(initSignature,100); }
function select(id,label,data,field,required){ return `<label class="text-sm font-bold">${label}</label><select id="${id}" ${required?'required':''} class="w-full border rounded-xl px-3 py-3 mb-3"><option value="">Selecione</option>${data.map(x=>`<option value="${x.id}">${safe(x[field])}</option>`).join('')}</select>`; }
function captureLocation(){ if(!navigator.geolocation)return alert('Geolocalização não suportada.'); navigator.geolocation.getCurrentPosition(p=>{document.getElementById('osLatLng').value=`${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)}`},e=>alert(e.message),{enableHighAccuracy:true,timeout:10000}); }
function initSignature(){ const c=document.getElementById('signature'); if(!c)return; c.width=c.offsetWidth*2; c.height=180*2; const ctx=c.getContext('2d'); ctx.lineWidth=4; ctx.lineCap='round'; signaturePad={drawing:false,canvas:c,ctx}; const pos=e=>{const r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e; return{x:(t.clientX-r.left)*2,y:(t.clientY-r.top)*2}}; c.onmousedown=c.ontouchstart=e=>{e.preventDefault(); signaturePad.drawing=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y)}; c.onmousemove=c.ontouchmove=e=>{if(!signaturePad.drawing)return; e.preventDefault(); const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke()}; c.onmouseup=c.onmouseleave=c.ontouchend=()=>signaturePad.drawing=false; }
function clearSignature(){ const c=signaturePad.canvas;if(c)signaturePad.ctx.clearRect(0,0,c.width,c.height); }
async function uploadFiles(files,osId){ const urls=[]; for(const f of files){ const ref=storage.ref(`ordens/${osId}/${Date.now()}_${f.name}`); await ref.put(f); urls.push(await ref.getDownloadURL()); } return urls; }
async function uploadSignature(osId){ const c=signaturePad.canvas; if(!c)return ''; const data=c.toDataURL('image/png'); if(data.length<5000)return ''; const blob=await (await fetch(data)).blob(); const ref=storage.ref(`assinaturas/${osId}.png`); await ref.put(blob); return await ref.getDownloadURL(); }
async function saveOS(e){ e.preventDefault(); const osId=uid(), cli=state.clientes[val('osCliente')], tecUid=isAdmin()?val('osTec'):currentUser.uid, tec=state.tecnicos[tecUid]||profile; const fotos=await uploadFiles(document.getElementById('fotos').files,osId); const assinatura=await uploadSignature(osId); const os={numero:Date.now(),clienteId:val('osCliente'),clienteNome:cli?.nome||'',tecnicoUid:tecUid,tecnicoNome:tec?.nome||'',local:val('osLocal'),data:val('osData'),hora:val('osHora'),status:val('osStatus'),problema:val('osProblema'),material:val('osMaterial')||'Não utilizado',latlng:val('osLatLng'),fotos,assinatura,criadoPor:currentUser.uid,criadoEm:firebase.database.ServerValue.TIMESTAMP}; await rtdb.ref('ordens/'+osId).set(os); await addFinanceiroFromOS(osId,os); await updateLocationHistory(osId,os); alert('OS salva e sincronizada.'); }
async function updateLocationHistory(osId,os){ if(!os.latlng)return; await rtdb.ref('locationHistory/'+currentUser.uid+'/'+Date.now()).set({osId,latlng:os.latlng,data:os.data,hora:os.hora}); }
async function addFinanceiroFromOS(osId,os){ await rtdb.ref('financeiro/'+uid()).set({tipo:'receita',descricao:'OS '+os.numero+' - '+os.clienteNome,valor:0,data:os.data,osId,status:'aberto',criadoEm:firebase.database.ServerValue.TIMESTAMP}); }
function ordersTable(list){ if(!list.length)return'<p class="text-slate-500">Nenhuma OS.</p>'; return`<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="bg-slate-100"><th class="p-2 text-left">Nº</th><th class="p-2 text-left">Cliente</th><th class="p-2 text-left">Técnico</th><th class="p-2 text-left">Data</th><th class="p-2 text-left">Status</th><th class="p-2 no-print">Ações</th></tr></thead><tbody>${list.map(o=>`<tr class="border-b"><td class="p-2 font-bold">${o.numero}</td><td class="p-2">${safe(o.clienteNome)}</td><td class="p-2">${safe(o.tecnicoNome)}</td><td class="p-2">${safe(o.data)} ${safe(o.hora)}</td><td class="p-2"><span class="px-2 py-1 rounded-lg text-xs font-bold ${o.status==='Concluído'?'bg-emerald-100 text-emerald-700':o.status==='Em andamento'?'bg-amber-100 text-amber-700':'bg-red-100 text-red-700'}">${safe(o.status)}</span></td><td class="p-2 no-print"><button onclick="viewOS('${o.id}')" class="bg-blue-700 text-white px-2 py-1 rounded">PDF</button> <button onclick="whatsOS('${o.id}')" class="bg-emerald-600 text-white px-2 py-1 rounded">WhatsApp</button></td></tr>`).join('')}</tbody></table></div>`; }
function whatsOS(id){ const o=state.ordens[id]; const msg=`Olá! A OS ${o.numero} do cliente ${o.clienteNome} foi atualizada para: ${o.status}. Técnico: ${o.tecnicoNome}.`; window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank'); }
async function viewOS(id){ const o=state.ordens[id]; const el=document.createElement('div'); el.className='p-6 bg-white'; el.innerHTML=`${state.company.logo?`<img src="${state.company.logo}" style="max-height:70px">`:''}<h1 style="font-size:24px;font-weight:900">Ordem de Serviço ${o.numero}</h1><p><b>Empresa:</b> ${safe(state.company.nome)}</p><p><b>Cliente:</b> ${safe(o.clienteNome)}</p><p><b>Técnico:</b> ${safe(o.tecnicoNome)}</p><p><b>Data:</b> ${safe(o.data)} ${safe(o.hora)}</p><p><b>Local:</b> ${safe(o.local)}</p><p><b>Status:</b> ${safe(o.status)}</p><p><b>Localização:</b> ${safe(o.latlng||'Não informada')}</p><h3>Problema</h3><p>${safe(o.problema)}</p><h3>Material</h3><p>${safe(o.material)}</p><h3>Fotos</h3>${(o.fotos||[]).map(u=>`<img src="${u}" style="width:30%;margin:1%;border-radius:8px">`).join('')||'<p>Sem fotos.</p>'}<h3>Assinatura do cliente</h3>${o.assinatura?`<img src="${o.assinatura}" style="max-width:300px;border:1px solid #ddd">`:'<p>Sem assinatura.</p>'}`; document.body.appendChild(el); const canvas=await html2canvas(el,{scale:2,useCORS:true}); const {jsPDF}=window.jspdf; const pdf=new jsPDF('p','mm','a4'); const img=canvas.toDataURL('image/png'), w=210,h=canvas.height*w/canvas.width; pdf.addImage(img,'PNG',0,0,w,h); pdf.save('OS_'+o.numero+'.pdf'); el.remove(); }

function renderClientes(){ document.getElementById('clientes').innerHTML=`<div class="grid lg:grid-cols-3 gap-4"><form onsubmit="saveCliente(event)" class="card p-4"><h3 class="font-black text-xl mb-3">Cliente</h3><input id="cliNome" required class="w-full border rounded-xl p-3 mb-2" placeholder="Nome/Razão social"><input id="cliTel" class="w-full border rounded-xl p-3 mb-2" placeholder="Telefone"><input id="cliEmail" class="w-full border rounded-xl p-3 mb-2" placeholder="E-mail"><input id="cliEnd" class="w-full border rounded-xl p-3 mb-2" placeholder="Endereço"><button class="btn bg-blue-700 text-white w-full py-3 rounded-xl font-black">Salvar</button></form><div class="card p-4 lg:col-span-2">${table(arr(state.clientes),['nome','telefone','email','endereco'])}</div></div>`; }
async function saveCliente(e){e.preventDefault(); await rtdb.ref('clientes/'+uid()).set({nome:val('cliNome'),telefone:val('cliTel'),email:val('cliEmail'),endereco:val('cliEnd'),criadoEm:firebase.database.ServerValue.TIMESTAMP});}
function renderTecnicos(){ if(!isAdmin())return; document.getElementById('tecnicos').innerHTML=`<div class="card p-4"><h3 class="font-black text-xl mb-3">Técnicos cadastrados</h3><p class="text-sm text-slate-500 mb-3">Crie o login no Firebase Authentication. Depois crie/edite o perfil abaixo usando o UID do usuário.</p><form onsubmit="saveTecnico(event)" class="grid md:grid-cols-5 gap-2 mb-4"><input id="tecUid" required class="border rounded-xl p-3" placeholder="UID Firebase"><input id="tecNome" required class="border rounded-xl p-3" placeholder="Nome"><input id="tecEmail" class="border rounded-xl p-3" placeholder="E-mail"><input id="tecTel" class="border rounded-xl p-3" placeholder="Telefone"><button class="bg-blue-700 text-white rounded-xl font-black">Salvar</button></form>${table(arr(state.tecnicos),['nome','email','telefone'])}</div>`; }
async function saveTecnico(e){e.preventDefault(); const id=val('tecUid'); const obj={nome:val('tecNome'),email:val('tecEmail'),telefone:val('tecTel'),role:'tecnico',ativo:true}; await rtdb.ref('tecnicos/'+id).set(obj); await rtdb.ref('users/'+id).set(obj);}
function renderEstoque(){ document.getElementById('estoque').innerHTML=`<div class="card p-4"><h3 class="font-black text-xl mb-3">Controle de Estoque</h3><form onsubmit="saveItem(event)" class="grid md:grid-cols-5 gap-2 mb-4"><input id="itNome" required class="border rounded-xl p-3" placeholder="Material"><input id="itQtd" type="number" required class="border rounded-xl p-3" placeholder="Qtd"><input id="itMin" type="number" class="border rounded-xl p-3" placeholder="Qtd mínima"><input id="itValor" type="number" step="0.01" class="border rounded-xl p-3" placeholder="Valor unit"><button class="bg-blue-700 text-white rounded-xl font-black">Salvar</button></form>${table(arr(state.estoque),['nome','qtd','min','valor'])}</div>`; }
async function saveItem(e){e.preventDefault(); await rtdb.ref('estoque/'+uid()).set({nome:val('itNome'),qtd:Number(val('itQtd')),min:Number(val('itMin')),valor:Number(val('itValor'))});}
function renderFinanceiro(){ const data=arr(state.financeiro), receita=data.filter(x=>x.tipo==='receita').reduce((s,x)=>s+Number(x.valor||0),0), desp=data.filter(x=>x.tipo==='despesa').reduce((s,x)=>s+Number(x.valor||0),0); document.getElementById('financeiro').innerHTML=`<div class="grid md:grid-cols-3 gap-3 mb-4">${stat('Receitas',brl(receita),'bg-emerald-600')}${stat('Despesas',brl(desp),'bg-red-600')}${stat('Saldo',brl(receita-desp),'bg-blue-700')}</div><div class="card p-4"><h3 class="font-black text-xl mb-3">Lançamentos</h3><form onsubmit="saveFin(event)" class="grid md:grid-cols-5 gap-2 mb-4"><select id="finTipo" class="border rounded-xl p-3"><option value="receita">Receita</option><option value="despesa">Despesa</option></select><input id="finDesc" required class="border rounded-xl p-3" placeholder="Descrição"><input id="finValor" type="number" step="0.01" required class="border rounded-xl p-3" placeholder="Valor"><input id="finData" type="date" value="${today()}" class="border rounded-xl p-3"><button class="bg-blue-700 text-white rounded-xl font-black">Salvar</button></form>${table(data,['tipo','descricao','valor','data','status'])}</div>`; }
async function saveFin(e){e.preventDefault(); await rtdb.ref('financeiro/'+uid()).set({tipo:val('finTipo'),descricao:val('finDesc'),valor:Number(val('finValor')),data:val('finData'),status:'lançado'});}
function renderRH(){ if(!isAdmin())return; const os=arr(state.ordens); document.getElementById('rh').innerHTML=`<div class="card p-4"><h3 class="font-black text-xl mb-3">Painel RH em tempo real</h3><p class="text-sm text-slate-500 mb-3">Acompanhamento de técnicos, OS e últimas localizações capturadas.</p>${table(arr(state.tecnicos),['nome','email','telefone','ativo'])}<h3 class="font-black text-lg mt-5 mb-2">OS por técnico</h3>${table(os,['tecnicoNome','clienteNome','status','latlng','data'])}</div>`; }
function renderRelatorios(){ document.getElementById('relatorios').innerHTML=`<div class="card p-4"><h3 class="font-black text-xl mb-3">Relatórios</h3><div class="grid md:grid-cols-4 gap-2 mb-4"><input id="rIni" type="date" value="${today()}" class="border rounded-xl p-3"><input id="rFim" type="date" value="${today()}" class="border rounded-xl p-3"><select id="rStatus" class="border rounded-xl p-3"><option value="">Todos</option><option>Pendente</option><option>Em andamento</option><option>Concluído</option></select><button onclick="reportPDF()" class="bg-blue-700 text-white rounded-xl font-black">Gerar PDF</button></div><div id="reportBox">${ordersTable(visibleOrders())}</div></div>`; }
async function reportPDF(){ const ini=val('rIni'),fim=val('rFim'),st=val('rStatus'); const list=visibleOrders().filter(o=>o.data>=ini&&o.data<=fim&&(!st||o.status===st)); const el=document.createElement('div'); el.className='p-6 bg-white'; el.innerHTML=`<h1>Relatório de OS</h1><p>${ini} até ${fim}</p>${ordersTable(list)}`; document.body.appendChild(el); const canvas=await html2canvas(el,{scale:2}); const {jsPDF}=window.jspdf; const pdf=new jsPDF('p','mm','a4'); const w=210,h=canvas.height*w/canvas.width; pdf.addImage(canvas.toDataURL('image/png'),'PNG',0,0,w,h); pdf.save('relatorio_os.pdf'); el.remove(); }
function renderConfig(){ if(!isAdmin())return; document.getElementById('config').innerHTML=`<div class="card p-4"><h3 class="font-black text-xl mb-3">Configurações</h3><input id="cfgNome" value="${safe(state.company.nome||'')}" class="w-full border rounded-xl p-3 mb-2" placeholder="Nome da empresa"><input id="cfgLogo" value="${safe(state.company.logo||'')}" class="w-full border rounded-xl p-3 mb-3" placeholder="URL da logo"><button onclick="saveCompany()" class="bg-blue-700 text-white px-4 py-3 rounded-xl font-black">Salvar empresa</button></div>`; }
async function saveCompany(){ await rtdb.ref('company').set({nome:val('cfgNome'),logo:val('cfgLogo')}); }
function table(data,fields){ if(!data.length)return'<p class="text-slate-500">Sem dados.</p>'; return`<div class="overflow-x-auto"><table class="w-full text-sm"><tbody>${data.map(x=>`<tr class="border-b">${fields.map(f=>`<td class="p-2"><b class="text-xs text-slate-400">${f}</b><br>${safe(x[f])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; }

function setupPWA(){ const manifest={name:'FieldPro OS SaaS',short_name:'FieldPro OS',start_url:'.',display:'standalone',background_color:'#0f172a',theme_color:'#0f172a',icons:[{src:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="%230f172a"/><text x="82" y="310" font-size="180" fill="white" font-family="Arial" font-weight="900">OS</text></svg>',sizes:'512x512',type:'image/svg+xml'}]}; const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'}); document.getElementById('manifestLink').href=URL.createObjectURL(blob); window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;}); if('serviceWorker'in navigator){ const sw=`self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>self.clients.claim());self.addEventListener('fetch',e=>{});`; navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'text/javascript'}))).catch(()=>{}); } }
async function installPWA(){ if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; } else alert('No iPhone: toque em Compartilhar > Adicionar à Tela de Início. No Android/Chrome: menu > Instalar app.'); }
init();
</script>
</body>
</html>
