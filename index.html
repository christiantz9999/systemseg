<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login SystemSeg</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: #fff;
      width: 360px;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input, button {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #1d4ed8;
    }

    .erro {
      color: red;
      font-size: 14px;
      margin-top: 10px;
      text-align: center;
    }

    .sucesso {
      color: green;
      font-size: 14px;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>Login</h2>

    <input type="email" id="email" placeholder="E-mail" />
    <input type="password" id="senha" placeholder="Senha" />

    <button onclick="login()">Entrar</button>
    <button onclick="criarConta()">Criar conta</button>

    <div id="mensagem"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAt2TnAniXroOM3azPGV_V_E7aRppHe8ck",
      authDomain: "systemseg.firebaseapp.com",
      projectId: "systemseg",
      storageBucket: "systemseg.appspot.com",
      messagingSenderId: "944347398449",
      appId: "1:944347398449:web:cca015078ceadf8e89b010",
      measurementId: "G-1KEH3RN3HV"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const mensagem = document.getElementById("mensagem");

    window.login = async function () {
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value.trim();

      mensagem.innerHTML = "";

      if (!email || !senha) {
        mensagem.innerHTML = `<p class="erro">Preencha e-mail e senha.</p>`;
        return;
      }

      try {
        await signOut(auth);

        const userCredential = await signInWithEmailAndPassword(auth, email, senha);

        mensagem.innerHTML = `<p class="sucesso">Login realizado com sucesso!</p>`;

        console.log("Usuário logado:", userCredential.user);

        // Redireciona após login
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1000);

      } catch (error) {
        console.error("Erro no login:", error);

        let textoErro = "Erro ao fazer login.";

        if (error.code === "auth/invalid-credential") {
          textoErro = "E-mail ou senha incorretos, ou usuário não existe.";
        } else if (error.code === "auth/user-not-found") {
          textoErro = "Usuário não encontrado.";
        } else if (error.code === "auth/wrong-password") {
          textoErro = "Senha incorreta.";
        } else if (error.code === "auth/invalid-email") {
          textoErro = "E-mail inválido.";
        } else if (error.code === "auth/too-many-requests") {
          textoErro = "Muitas tentativas. Aguarde alguns minutos.";
        }

        mensagem.innerHTML = `<p class="erro">${textoErro}</p>`;
      }
    };

    window.criarConta = async function () {
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value.trim();

      mensagem.innerHTML = "";

      if (!email || !senha) {
        mensagem.innerHTML = `<p class="erro">Preencha e-mail e senha.</p>`;
        return;
      }

      if (senha.length < 6) {
        mensagem.innerHTML = `<p class="erro">A senha precisa ter pelo menos 6 caracteres.</p>`;
        return;
      }

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, senha);

        mensagem.innerHTML = `<p class="sucesso">Conta criada com sucesso!</p>`;

        console.log("Usuário criado:", userCredential.user);

      } catch (error) {
        console.error("Erro ao criar conta:", error);

        let textoErro = "Erro ao criar conta.";

        if (error.code === "auth/email-already-in-use") {
          textoErro = "Este e-mail já está cadastrado.";
        } else if (error.code === "auth/invalid-email") {
          textoErro = "E-mail inválido.";
        } else if (error.code === "auth/weak-password") {
          textoErro = "Senha fraca. Use pelo menos 6 caracteres.";
        }

        mensagem.innerHTML = `<p class="erro">${textoErro}</p>`;
      }
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        console.log("Usuário ativo:", user.email);
      } else {
        console.log("Nenhum usuário logado.");
      }
    });
  </script>

</body>
</html>
